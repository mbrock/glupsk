<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glupsk Web Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sanchez:wght@400;700&family=Enriqueta:wght@400;700&family=Kay+Pho+Du:wght@400;700&family=Zilla+Slab:wght@400;700&family=Courier+Prime:wght@400;700&family=IBM+Plex+Serif:wght@400;700&family=Instrument+Serif:wght@400;700&family=Source+Serif+4:wght@400;700&family=Literata:wght@400;700&family=Scheherazade+New:wght@400;700&family=Lisu+Bosa:wght@400;700&family=Gentium+Book+Plus:wght@400;700&family=Vollkorn:wght@400;700&family=Vollkorn+SC:wght@400;700&family=Vesper+Libre:wght@400;700&family=EB+Garamond:wght@400;700&family=Crimson+Text:wght@400;700&family=Fraunces:wght@400;700&family=Crimson+Pro:wght@400;700&family=Libre+Caslon+Text:wght@400;700&family=Buenard:wght@400;700&family=Eczar:wght@400;700&family=Xanh+Mono:wght@400;700&family=Neuton:wght@400;700&family=Bona+Nova:wght@400;700&family=Coustard:wght@400;700&family=Public+Sans:wght@400;700&family=Host+Grotesk:wght@400;700&family=Padauk:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Rubik:wght@400;700&family=Datatype:wght@400;700&family=DM+Sans:wght@400;700&display=swap"
    >
    <link rel="stylesheet" href="./player.css">
  </head>
  <body>
    <main class="player" aria-label="Glupsk interactive fiction player">
      <form class="font-picker" id="font-picker">
        <label for="buffer-font">Text font</label>
        <select id="buffer-font"></select>
      </form>
      <section id="windows" class="windows" aria-live="polite"></section>
      <form id="command-form" class="command" aria-label="Command line" hidden>
        <input
          id="command-input"
          autocomplete="off"
          spellcheck="false"
          aria-label="Command"
          disabled
        >
      </form>
      <output id="status" class="status" aria-live="polite">Loading...</output>
    </main>
    <script type="module" src="./player.js"></script>
  </body>
</html>
