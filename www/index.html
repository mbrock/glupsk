<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glupsk Web Player</title>
    <link rel="stylesheet" href="./player.css">
  </head>
  <body>
    <main class="player" aria-label="Glupsk interactive fiction player">
      <section id="windows" class="windows" aria-live="polite"></section>
      <form id="command-form" class="command">
        <input
          id="command-input"
          autocomplete="off"
          spellcheck="false"
          aria-label="Command"
          placeholder="Type a command..."
          disabled
        >
        <button type="submit">Send</button>
      </form>
      <output id="status" class="status" aria-live="polite">Loading...</output>
    </main>
    <script type="module" src="./player.js"></script>
  </body>
</html>
