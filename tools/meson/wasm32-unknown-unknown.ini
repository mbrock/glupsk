[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'
c_ld = '/usr/bin/wasm-ld-20'
cpp_ld = '/usr/bin/wasm-ld-20'

[built-in options]
cpp_args = ['--target=wasm32-unknown-unknown']
cpp_link_args = ['--target=wasm32-unknown-unknown']

[host_machine]
system = 'unknown'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
